name: CI/CD Docker Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Iniciar sesión en Docker Hub usando los Secrets
      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.USER_DOCKERHUB }}
          password: ${{ secrets.PASSWORD_DOCKERHUB }}

      # 3. Configurar Docker Buildx (necesario para builds avanzados/multi-arquitectura)
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Construir y subir la imagen a Docker Hub
      - name: Build y Push de la imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Reemplaza 'mi-app-nginx' con el nombre que desees para tu repositorio en Docker Hub
          tags: ${{ secrets.USER_DOCKERHUB }}/mi-app-nginx:latest